<!DOCTYPE html>

<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2330;--mut:#6b7385;--ac:#2f6fed}

*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:12px;padding-top:max(12px,env(safe-area-inset-top))}
h1{font-size:20px;margin:4px 0 10px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #8884;background:var(--card);color:var(--tx);font-size:16px}
.bar{display:flex;gap:8px;margin:10px 0;overflow-x:auto}
.chip{padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid #8884;white-space:nowrap;font-size:14px;color:var(--tx)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;border-left:6px solid var(--c)}
.top{display:flex;justify-content:space-between;align-items:start;gap:8px}
.card h2{font-size:17px;margin:0}.meta{color:var(--mut);font-size:13px;margin:4px 0}
.fav{background:none;border:0;font-size:24px;color:var(--ac)}
.det{display:none;margin-top:8px;font-size:14px;line-height:1.45}.card.open .det{display:block}
.det b{display:block;margin-top:6px}ul{margin:4px 0;padding-left:20px}
a.btn{display:inline-block;margin-top:10px;padding:9px 14px;background:var(--ac);color:#fff;border-radius:10px;text-decoration:none;font-size:14px}
.note{color:var(--mut);font-size:12px;margin:14px 0}
summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}
</style></head><body>
<h1>📚 Школа 7 класс</h1>
<div class="bar"><button class="chip on" id="t1" onclick="tab(1)">Учебники</button><button class="chip" id="t2" onclick="tab(2)">🚌 Расписание</button></div>

<p class="note">Краткая справка — примерные темы по программе. Точное содержание смотри в оглавлении своего учебника. Полные тексты учебников защищены авторским правом: читай их на официальных ресурсах издательства.</p></div><div id="v2" style="display:none"></div>
<script>
const B=[

 d:["Введение: что изучает физика, измерения","Строение вещества: молекулы, диффузия","Движение и взаимодействие: скорость, масса, плотность, сила","Давление твёрдых тел, жидкостей и газов","Работа, мощность, энергия, простые механизмы"],
 k:["скорость v = s/t","плотность ρ = m/V","давление p = F/S","сила тяжести F = mg","работа A = Fs"]},
{s:"Литература",t:"Литература 7, часть 1",a:"В. Я. Коровина, В. П. Журавлёв, В. И. Коровин",p:"Просвещение",c:"#1f9d7a",
 d:["Устное народное творчество: былины, пословицы","Древнерусская литература","Литература XVIII века","Русская литература XIX века (первая часть курса)"],k:["жанры фольклора","былина","басня"]},
{s:"Литература",t:"Литература 7, часть 2",a:"В. Я. Коровина, В. П. Журавлёв, В. И. Коровин",p:"Просвещение",c:"#1f9d7a",

{s:"Биология",t:"Биология 7 («Линия жизни», базовый уровень)",a:"см. обложку своего учебника",p:"Просвещение",c:"#2a9d8f",
 d:["Многообразие живых организмов","Классификация и систематика","Строение и жизнедеятельность организмов","Среда обитания и роль в природе"],k:["вид","царство","систематика"]},
{s:"История",t:"История России, XVI–XVII вв.",a:"В. Р. Мединский, А. В. Торкунов",p:"Просвещение",c:"#2f6fed",

{s:"История",t:"История Нового времени, конец XV–XVII в.",a:"В. Р. Мединский, А. О. Чубарьян",p:"Просвещение",c:"#3a7bd5",

{s:"География",t:"География 7 («Полярная звезда»)",a:"см. обложку своего учебника",p:"Просвещение",c:"#c9a400",

{s:"Информатика",t:"Информатика 7, часть 2 (углублённый уровень)",a:"Л. Л. Босова, А. Ю. Босова, Н. А. Аквилянов",p:"Просвещение",c:"#7b5cd6",
 d:["Работа с текстом и графикой","Мультимедиа","Основы алгоритмизации (по оглавлению учебника)"],k:["алгоритм","текстовый редактор","растр и вектор"]}
];
const U={"Физика": "https://gdzbakulin.ru/7-klass/kratkie-soderzhaniya/kratkiy-pereskaz-fizika-7-klass-uchebnik/", "История Нового времени": "https://gdzbakulin.ru/7-klass/kratkie-soderzhaniya/kratkiy-pereskaz-7-klass-medinskiy-chubariyan/", "История России": "https://gdzbakulin.ru/7-klass/kratkie-soderzhaniya/kratkiy-pereskaz-7-klass-medinskiy-torkunov/", "География": "https://gdzbakulin.ru/7-klass/kratkie-soderzhaniya/kratkiy-pereskaz-geografiya-7-klass-uchebnik/", "Биология": "https://gdzbakulin.ru/7-klass/kratkie-soderzhaniya/kratkiy-pereskaz-7-klass-pasechnik/", "Литература": "https://gdzbakulin.ru/7-klass/literatura/korovina-7-klass/", "Информатика": "https://reshak.ru/reshebniki/informatika/7/bosova_ugl/index.html"};
let fav=[],f="Все",ok=true;
try{fav=JSON.parse(localStorage.getItem("fav")||"[]")}catch(e){}
const subs=["Все","★ Избранное",...new Set(B.map(x=>x.s))];
function bar(){document.getElementById("bar").innerHTML=subs.map(x=>`<button class="chip ${x==f?"on":""}" onclick="f='${x}';bar();draw()">${x}</button>`).join("")}
function draw(){
 const q=document.getElementById("q").value.toLowerCase();
 document.getElementById("list").innerHTML=B.map((b,i)=>({b,i})).filter(({b,i})=>
  (f=="Все"||(f.startsWith("★")?fav.includes(i):b.s==f))&&
  (b.t+b.a+b.s+b.d.join()+b.k.join()).toLowerCase().includes(q)).map(({b,i})=>`
 <div class="card" style="--c:${b.c}" id="c${i}">
 <div class="top"><div onclick="go(${i})" style="flex:1"><h2>${b.t} ↗</h2><div class="meta">${b.a} · нажми, чтобы открыть краткое содержание</div><a class="btn" style="background:none;color:var(--ac);padding:4px 0" href="javascript:void(0)" onclick="event.stopPropagation();document.getElementById('c${i}').classList.toggle('open')">Темы и понятия ▾</a></div>
 <button class="fav" onclick="tg(${i})">${fav.includes(i)?"★":"☆"}</button></div>
 <div class="det"><b>Основные темы</b><ul>${b.d.map(x=>`<li>${x}</li>`).join("")}</ul><b>Ключевые понятия</b><ul>${b.k.map(x=>`<li>${x}</li>`).join("")}</ul>
 </div></div>`).join("")||"<p>Ничего не найдено</p>"}
function go(i){const b=B[i];const k=Object.keys(U).find(x=>b.t.startsWith(x));window.open(k?U[k]:"https://yandex.ru/search/?text="+encodeURIComponent(b.t+" краткое содержание"),"_blank")}
function tg(i){fav=fav.includes(i)?fav.filter(x=>x!=i):[...fav,i];try{localStorage.setItem("fav",JSON.stringify(fav))}catch(e){}draw()}
document.getElementById("q").oninput=draw;bar();draw();
</script><script>
const P=s=>s.split(" ").map(x=>{const a=x.split(":");return +a[0]*60+ +a[1]}),F=m=>Math.floor(m/60)+":"+String(m%60).padStart(2,"0");
function tm(v){const a=v.split(":");return +a[0]*60+ +a[1]}
const T={h:P("6:55 7:35 8:15 8:55 9:35 10:15 11:25 12:45 13:25 14:05 14:55 15:55 17:15 17:55 18:35 19:15 20:25 21:40 22:50"),p:P("6:07 6:42 7:22 8:02 8:42 9:22 10:32 11:52 12:32 13:12 14:02 15:02 16:22 17:02 17:42 18:22 19:32 20:52 22:02")};
const D={
1:{n:"Понедельник",L:[["12:20","13:00","0","Английский (Левина)","39"],["13:20","14:00","1","История","37"],["14:15","14:55","2","Алгебра","31"],["15:10","15:50","3","Русский","28"],["16:05","16:35","КЧ","Классный час",""],["16:40","17:20","4","География","29"],["17:30","18:10","5","Русский","28"]]},
2:{n:"Вторник",L:[["11:50","12:30","0","ИЗО","30"],["12:50","13:30","1","Геометрия","31"],["13:50","14:30","2","Литература","28"],["14:45","15:25","3","Информатика","38"],["15:40","16:20","4","Физика","40"],["16:30","17:10","5","Биология","25"],["17:20","18:00","6","Физкультура",""]]},
3:{n:"Среда",L:[["11:50","12:30","0","Алгебра","31"],["12:50","13:30","1","Русский","28"],["13:50","14:30","2","История","35"],["14:45","15:25","3","Информатика","38"],["15:40","16:20","4","География","29"],["16:30","17:10","5","Литература","28"],["17:20","18:00","6","Английский (Левина)","20"]]},
4:{n:"Четверг",L:[["12:20","13:00","0","Труд",""],["13:20","14:00","1","Труд",""],["14:15","14:55","2","Геометрия","31"],["15:10","15:50","3","Вероятность и статистика","31"],["16:05","16:35","КЧ","Классный час",""],["16:40","17:20","4","Музыка","30"]]},
5:{n:"Пятница",L:[["11:50","12:30","0","Физкультура",""],["12:50","13:30","1","Алгебра","31"],["13:50","14:30","2","Алгебра","31"],["14:45","15:25","3","Русский","28"],["15:40","16:20","4","Физика","40"],["16:30","17:10","5","История","35"]]}};
let S={ride:18,walk:5,k:(new Date().getDay()%6==0?1:new Date().getDay())};
try{const x=JSON.parse(localStorage.getItem("bus2")||"null");if(x){S.ride=x.ride;S.walk=x.walk}}catch(e){}
function sv(){try{localStorage.setItem("bus2",JSON.stringify({ride:S.ride,walk:S.walk}))}catch(e){}busDraw()}
function tab(n){["1","2"].forEach(i=>{document.getElementById("v"+i).style.display=n==i?"":"none";document.getElementById("t"+i).className="chip"+(n==i?" on":"")});if(n==2)busDraw()}
const LS=k=>D[k].L.map(l=>({s:tm(l[0]),e:tm(l[1]),n:l[2],t:l[3],r:l[4]}));
function bf(l){const need=l.s-S.walk-S.ride,a=T.h.filter(x=>x<=need);return{b:a[a.length-1],bk:a[a.length-2],z:need-a[a.length-1]}}
function dayHtml(k,tag,op){
 const L=LS(k),f=bf(L[0]),last=L[L.length-1],hm=T.p.find(x=>x>=last.e+S.walk);
 let h=`<details class="card" style="--c:${tag?"#e0572f":"#2a9d8f"}"${op?" open":""}><summary><h2>${D[k].n}${tag?" · "+tag:""}</h2><div class="meta">${L.filter(l=>l.n!="КЧ").length} ур. · ${F(L[0].s)}–${F(last.e)} · к 1-му уроку выезд ${f.b!==undefined?"<b>"+F(f.b)+"</b>":"—"} · домой ${hm!==undefined?F(hm):"—"}</div></summary>`;
 L.forEach(l=>{const g=bf(l),h2=T.p.find(x=>x>=l.e+S.walk);
  const r=(g.b!==undefined?`🚌 выезд <b>${F(g.b)}</b>, запас ${g.z} мин${g.z<5?" ⚠️":""}`+(g.bk!==undefined?`, запасной ${F(g.bk)}`:""):"🚌 нет автобуса")+`<br>🏠 домой: ${h2!==undefined?"<b>"+F(h2)+"</b>":"—"}`;
  h+=`<div style="padding:8px 0;border-top:1px solid #8883"><b>${l.n=="КЧ"?"":l.n+" урок · "}${l.t}</b><div class="meta">${F(l.s)}–${F(l.e)}${l.r?" · каб. "+l.r:""}</div><div style="font-size:14px">${r}</div></div>`});
 return h+`</details>`}
function busDraw(){
 const now=new Date(),nm=now.getHours()*60+now.getMinutes(),td=now.getDay(),nk=td>=1&&td<=4?td+1:1,wd=td>=1&&td<=5;
 let n="Сегодня выходной.";
 if(wd){const nx=T.h.find(x=>x>=nm);n="Автобусов от Тундрового сегодня больше нет.";
  if(nx!==undefined){const ar=nx+S.ride,L=LS(td),l=L.findIndex(x=>x.s>=ar+S.walk);
   n=`Ближайший автобус от <b>Тундрового</b>: <b>${F(nx)}</b> (через ${nx-nm} мин). В Детском парке будешь ~${F(ar)}.<br>`+(l>=0?`Успеешь к уроку «${L[l].t}» (начало ${F(L[l].s)}).`:"К сегодняшним урокам уже не успеваешь.")}}
 let h=`<div class="card" style="--c:#2f6fed"><h2>🚌 Сейчас</h2><div class="det" style="display:block">${n}</div></div><p class="meta">Нажми на день, чтобы раскрыть или свернуть.</p>`;
 for(let k=1;k<=5;k++){const tag=wd&&k==td?"сегодня":k==nk?((td+1)%7==k?"завтра":"ближайший"):"";h+=dayHtml(k,tag,tag!=="")}
 h+=`<div class="card" style="--c:#6b7385"><h2>Настройки</h2><div class="det" style="display:block">Дорога в автобусе, мин<input type="number" value="${S.ride}" onchange="S.ride=+this.value||0;sv()">Пешком от остановки до школы, мин<input type="number" value="${S.walk}" onchange="S.walk=+this.value||0;sv()"></div></div>`;
 h+=`<div class="card" style="--c:#e0572f"><b>Тундровый → Центральный рынок (будни)</b><div class="meta">${T.h.map(F).join(" · ")}</div></div><div class="card" style="--c:#c9a400"><b>Детский парк → ул. Фурманова (будни)</b><div class="meta">${T.p.map(F).join(" · ")}</div></div>
 <p class="note">7-В, вторая смена, группа Левина. Всё списано с фото: проверь по бумажкам. Автобусы могут опаздывать.</p>`;
 document.getElementById("v2").innerHTML=h}
</script>
