name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['Nomera.apk']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android && npx cap sync android
      - name: Icon, TTS permission, signing key
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r resources/res/* android/app/src/main/res/
          sed -i 's#<application#<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>\n    <application#' android/app/src/main/AndroidManifest.xml
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
          cat >> android/app/build.gradle <<'EOF'

android {
    signingConfigs {
        debug {
            storeFile file("$rootDir/../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
}
EOF
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Nomera.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Nomera.apk --title "Nomera APK" --notes "Latest build" --target "$GITHUB_SHA"
